<!DOCTYPE html>
<html>
<head>
    <title>glm-js WASM Test Harness</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 10px;
            background: rgba(0,0,0,0.5);
            color: white;
            border-radius: 5px;
        }
        textarea {
            width: 300px;
            height: 150px;
            display: block;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div id="controls">
        <textarea id="code-editor">
// (u, v, time) => glm.vec3
(u, v, time) => {
    const x = (u - 0.5) * 20;
    const y = Math.sin(x + time) * 2;
    const z = (v - 0.5) * 20;
    return glm.vec3(x, y, z);
}
        </textarea>
        <button id="run-button">Run</button>
        <input type="checkbox" id="live-update" checked>
        <label for="live-update">Live Update</label>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        var Module = {};
    </script>
    <script src="../build/glm-wasm.js"></script>
    <script src="../src-wasm/glm-wasm-loader.js"></script>

    <script>
        let glm;
        let scene, camera, renderer, mesh;
        let parametricFunction = (u, v, time) => glm.vec3((u - 0.5) * 20, Math.sin(u * 20 + time) * 2, (v - 0.5) * 20);

        const codeEditor = document.getElementById('code-editor');
        const runButton = document.getElementById('run-button');
        const liveUpdateCheckbox = document.getElementById('live-update');

        function updateSurface() {
            try {
                parametricFunction = eval(codeEditor.value);
            } catch (e) {
                console.error('Error parsing parametric function:', e);
            }
        }

        runButton.addEventListener('click', updateSurface);
        codeEditor.addEventListener('input', () => {
            if (liveUpdateCheckbox.checked) {
                updateSurface();
            }
        });

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 15;

            renderer = new THREE.WebGLRenderer();
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            const geometry = new THREE.PlaneGeometry(20, 20, 50, 50);
            const material = new THREE.MeshBasicMaterial({ color: 0x00ff00, wireframe: true });
            mesh = new THREE.Mesh(geometry, material);
            scene.add(mesh);

            window.addEventListener('resize', onWindowResize, false);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate(time) {
            requestAnimationFrame(animate);

            if (glm) {
                glm.frame();
            }

            const timeSeconds = time * 0.001;
            const positions = mesh.geometry.attributes.position;
            const vertex = new THREE.Vector3();

            for (let i = 0; i < positions.count; i++) {
                const u = (positions.getX(i) + 10) / 20;
                const v = (positions.getY(i) + 10) / 20;
                const result = parametricFunction(u, v, timeSeconds);
                vertex.set(result.x, result.y, result.z);
                positions.setXYZ(i, vertex.x, vertex.y, vertex.z);
            }
            positions.needsUpdate = true;

            mesh.rotation.y += 0.005;

            renderer.render(scene, camera);
        }

        Module.init().then(g => {
            glm = g;
            console.log('glm-wasm initialized');
            init();
            animate(0);
        });
    </script>
</body>
</html>
